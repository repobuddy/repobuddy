minimumReleaseAge: 1440
minimumReleaseAgeStrict: true

# First-party packages are exempt from the soak.
#
# The soak exists to stop a COMPROMISED THIRD-PARTY release being pulled into a build
# within hours of publication. It does not describe our own packages: we control what
# goes into them, and a first-party release is reviewed before it is published, not
# after. Applying it to ourselves only means a fresh publish is invisible to the next
# repo in the chain for 24h.
minimumReleaseAgeExclude:
  - assertron
  - satisfier
  - tersify
  - unpartial
  - type-plus
  - path-equal
  - iso-error
  - iso-error-web
  - iso-error-google-cloud-api
  - google-cloud-api
  - standard-log
  - standard-log-color
  - async-fp
  - fsa-emitter
  - progress-str
  - clibuilder
  - args-minus
  - global-store
  - stable-store
  - mocktomata
  - just-func
  - storybook-addon-vis
  - vitest-plugin-vis
  - node-supported-releases
  - buddy-agent-harness
  - universal-plugin
  - '@just-func/*'
  - '@just-web/*'
  - '@mocktomata/*'
  - '@repobuddy/*'
  - '@unional/*'
  # Council-authorized soak exemption for cyber-agentkit 2.0.0; remove after 2026-11-05T04:01Z.
  - cyber-agentkit@2.0.0
  # Council-authorized soak exemption for cyber-agentkit 2.1.0; remove after 2026-11-05T16:53Z.
  - cyber-agentkit@2.1.0
  # Renovate security update: sharp@0.35.5
  - sharp@0.35.5
  # Renovate security update: @vitest/browser@5.0.5
  - '@vitest/browser@5.0.5'

packages:
  - examples/*
  - packages/*
  - testcases/*
  - website
allowBuilds:
  '@swc/core': true
  esbuild: true
  fsevents: true
  sharp: true
  unrs-resolver: true
