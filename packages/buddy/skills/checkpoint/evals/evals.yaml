runs: 3
threshold: 2
trigger:
  - id: fire-save-stop-here
    prompt: let's stop here, save a checkpoint so I can pick this up tomorrow
    expect: fire
  - id: fire-save-pause
    prompt: pause this, I'll continue in a new session
    expect: fire
  - id: fire-save-create-alias
    prompt: create a checkpoint of this work
    expect: fire
  - id: fire-resume-pick-up
    prompt: pick up where we left off with the parse-null checkpoint
    expect: fire
  - id: fire-list-checkpoints
    prompt: what checkpoints do I have in this repo?
    expect: fire
  - id: skip-commit
    prompt: commit these changes
    expect: skip
  - id: skip-stash
    prompt: stash my uncommitted changes so I can switch branches
    expect: skip
  - id: skip-file-issue
    prompt: file an issue for the work we still have left
    expect: skip
  - id: skip-list-prs
    prompt: list the open pull requests in this repo
    expect: skip
rubrics:
  # help (SKILL.md)
  C1:
    - regex: '\bsave\b'
    - regex: '\bresume\b'
    - regex: '\blist\b'
    - regex: '\bhelp\b'
    - script: test -z "$(git status --porcelain)"
  # save (references/save.md)
  C2:
    - script: |
        d="$(git rev-parse --path-format=absolute --git-common-dir)/repobuddy/checkpoints"
        test "$(ls "$d"/*.md 2>/dev/null | wc -l)" -eq 1 &&
          grep -q '^## NEXT' "$d"/*.md &&
          grep -q '^## Not in git' "$d"/*.md
  C3:
    - script: |
        test "$(git rev-list --count HEAD)" -eq 1 &&
          test "$(git status --porcelain)" = " M src/parse.js"
  C4:
    - script: |
        test "$(git rev-list --count HEAD)" -eq 2 &&
          git diff --name-only HEAD~1 HEAD | grep -q . &&
          ! git diff --name-only HEAD~1 HEAD | grep -v '^\.agents/repobuddy/checkpoints/' &&
          ! git grep -nE '/(home|Users)/' HEAD -- .agents/repobuddy/checkpoints
  C5:
    - regex: 'checkpoint\W+resume\s+`?[a-z0-9]+(-[a-z0-9]+)*'
  # resume (references/resume.md)
  C6:
    - script: |
        f="$(git rev-parse --path-format=absolute --git-common-dir)/repobuddy/checkpoints/parse-null.md"
        test -f "$f" && grep -q '^resumed:' "$f" && grep -qE '^[[:space:]]+at:' "$f"
  C7:
    - script: |
        start="$(git rev-list --max-parents=0 HEAD)"
        ! git diff --quiet "$start" -- test/parse.test.js &&
          grep -q 'null' test/parse.test.js &&
          ! grep -qE 'return[[:space:]]*\{[[:space:]]*\}' src/parse.js
  C10:
    - regex: 'Branch `?parse-null`? is checked out at'
    - script: |
        f="$(git rev-parse --path-format=absolute --git-common-dir)/repobuddy/checkpoints/parse-null.md"
        wt="$(git worktree list --porcelain | sed -n 's/^worktree //p' | sed -n 2p)"
        ! grep -q '^resumed:' "$f" &&
          test -z "$(git status --porcelain)" &&
          test -z "$(git -C "$wt" status --porcelain)" &&
          test "$(git branch --show-current)" = main
  # list (references/list.md)
  C8:
    - contains: parse-null
    - contains: docs-refresh
    - regex: 'parse\(null\)'
    - regex: '[Ii]nstall section'
  C9:
    - script: |
        d="$(git rev-parse --path-format=absolute --git-common-dir)/repobuddy/checkpoints"
        ! grep -q '^resumed:' "$d"/*.md && test -z "$(git status --porcelain)"
outcome:
  # help
  - id: help
    prompt: Show the checkpoint skill's help.
    files: files/help
    criteria: [C1]
