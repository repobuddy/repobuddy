name: min-release-age

# Removes minimum-release-age exemptions whose window has passed and opens a PR.
# Only lines carrying a `# min-release-age: exempt … until …` marker (or an older `lift` one) are touched.
#
# The shared workflow opens the PR with a repobuddy GitHub App token, so the
# restore PR runs required checks. It needs the REPOBUDDY_APP_ID and
# REPOBUDDY_APP_PRIVATE_KEY secrets, set on each org that has the app.

on:
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  restore:
    uses: repobuddy/.github/.github/workflows/min-release-age.yml@v2
    secrets: inherit
