name: release
on:
  push:
    branches: [main]

jobs:
  code:
    uses: repobuddy/.github/.github/workflows/pnpm-verify.yml@v2
    with:
      os: '["ubuntu-latest"]'

  release:
    uses: repobuddy/.github/.github/workflows/pnpm-release-changeset-oidc.yml@v2
    needs: code
    # Declaring `permissions:` replaces the default set, so every scope the
    # callee needs must be listed here — unlisted ones drop to `none`, not to
    # the default.
    permissions:
      # Mints the OIDC token npm exchanges for short-lived publish credentials.
      id-token: write
      # Lets changesets/action push the version branch and tags.
      contents: write
      # Lets changesets/action open the "version packages" PR.
      pull-requests: write

  docgen:
    uses: repobuddy/.github/.github/workflows/pnpm-docs.yml@v2
    needs: release
    with:
      publish-dir: ./website/dist
